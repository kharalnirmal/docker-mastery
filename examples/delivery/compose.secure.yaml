# Overlay either ORM's base compose.yaml. Local/demo deployment, not public auth.
services:
  app:
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /app/.next/cache:rw,nosuid,size=128m,uid=1000,gid=1000
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  db:
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
