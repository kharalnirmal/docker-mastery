x-logging: &bounded-logs
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    logging: *bounded-logs
    image: postgres:18-bookworm
    environment:
      POSTGRES_USER: tracker
      POSTGRES_DB: tracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker -d tracker"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    logging: *bounded-logs
    build:
      context: .
      target: runner
    environment:
      DATABASE_URL: postgresql://tracker:${POSTGRES_PASSWORD}@db:5432/tracker
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    init: true
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
  tools:
    logging: *bounded-logs
    profiles: ["tools"]
    build:
      context: .
      target: development
    environment:
      DATABASE_URL: postgresql://tracker:${POSTGRES_PASSWORD}@db:5432/tracker
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
