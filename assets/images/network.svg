<svg xmlns="http://www.w3.org/2000/svg" width="800" height="260" viewBox="0 0 800 260" role="img" aria-labelledby="title desc"><title id="title">Container network DNS</title><desc id="desc">A client resolves web through Docker DNS on the user-defined bridge ninja-net and sends HTTP to container port 80. There is no host port publication.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="m0 0 8 4-8 4" fill="#0070f3"/></marker></defs><rect width="800" height="260" fill="#fafafa"/><g font-family="Inter,system-ui,sans-serif" fill="#222"><text x="25" y="30" font-size="16" font-weight="bold">LINUX ENGINE · USER-DEFINED BRIDGE: ninja-net</text><rect x="25" y="55" width="750" height="140" rx="10" fill="#e6f1fe" stroke="#0070f3" stroke-dasharray="5 4"/><rect x="45" y="80" width="210" height="88" rx="8" fill="#fff" stroke="#aaa"/><text x="64" y="112" font-size="16">Alpine client</text><text x="64" y="142" font-size="13">wget http://web</text><rect x="500" y="80" width="250" height="88" rx="8" fill="#fff" stroke="#aaa"/><text x="520" y="112" font-size="16">NGINX server · alias web</text><text x="520" y="142" font-size="13">Container HTTP port 80</text><path d="M255 125h238" stroke="#0070f3" stroke-width="2" marker-end="url(#a)"/><text x="280" y="107" font-size="12">Docker DNS → request</text><text x="25" y="231" font-size="13">No -p required. Host browsers do not automatically resolve this private network's names.</text></g></svg>
