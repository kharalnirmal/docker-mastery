<svg xmlns="http://www.w3.org/2000/svg" width="800" height="310" viewBox="0 0 800 310" role="img" aria-labelledby="title desc"><title id="title">Context to image to container</title><desc id="desc">The builder receives filtered host files, selects a base image, copies and checks the page, and configures startup. The resulting image can create containers.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="m0 0 8 4-8 4" fill="#216b56"/></marker></defs><rect width="800" height="310" fill="#f6f8f3"/><g font-family="system-ui,sans-serif" fill="#22382d"><text x="25" y="32" font-size="16" font-weight="bold">BUILD TIME ≠ RUN TIME</text><rect x="25" y="65" width="205" height="165" rx="9" fill="#fff" stroke="#abbcae"/><text x="42" y="95" font-size="16">Host build context</text><text x="42" y="129" font-size="14">Dockerfile</text><text x="42" y="155" font-size="14">index.html</text><text x="42" y="192" font-size="12">.dockerignore filters files</text><rect x="290" y="65" width="240" height="165" rx="9" fill="#e8f1e9" stroke="#216b56"/><text x="309" y="95" font-size="16">Builder → image</text><text x="309" y="125" font-size="13">FROM · base filesystem</text><text x="309" y="150" font-size="13">COPY · page layer</text><text x="309" y="175" font-size="13">RUN · build-time check</text><text x="309" y="200" font-size="13">CMD · startup configuration</text><rect x="590" y="95" width="185" height="110" rx="9" fill="#fff" stroke="#216b56"/><text x="610" y="134" font-size="16">Container</text><text x="610" y="163" font-size="13">NGINX serves page</text><path d="M230 145H283M530 145H583" stroke="#216b56" stroke-width="2" marker-end="url(#a)"/><text x="25" y="275" font-size="13">Rebuilding an image does not replace existing containers. Recreate the lab container to use it.</text></g></svg>
