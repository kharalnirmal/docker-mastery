<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title description">
  <title id="title">Interpolation precedes container environment</title><desc id="description">The shell and selected env file supply interpolation inputs. Compose resolves its service model. Explicit service environment settings then become the container environment; reading an env file does not automatically inject every variable.</desc>
  <rect width="640" height="360" rx="16" fill="#f1f5f9"/>
  <g font-family="sans-serif" font-size="18" text-anchor="middle" fill="#0f172a">
    <text x="320" y="32" font-weight="bold">Template inputs are not all runtime variables</text>
    <rect x="24" y="57" width="592" height="54" rx="10" fill="#dbeafe" stroke="#1d4ed8"/><text x="320" y="90">Shell + selected interpolation env file</text>
    <path d="M320 115v27m-6-7 6 7 6-7" fill="none" stroke="#334155" stroke-width="3"/>
    <rect x="24" y="150" width="592" height="62" rx="10" fill="#dbeafe" stroke="#1d4ed8"/><text x="320" y="176">Phase 1: resolved Compose model</text><text x="320" y="200" font-size="15">Ports, image references, service settings</text>
    <path d="M320 216v27m-6-7 6 7 6-7" fill="none" stroke="#334155" stroke-width="3"/>
    <rect x="24" y="251" width="592" height="62" rx="10" fill="#dcfce7" stroke="#15803d"/><text x="320" y="277">Phase 2: container environment</text><text x="320" y="301" font-size="15">Explicit service environment / env_file + image defaults</text>
    <text x="320" y="343" font-size="15">Validate quietly. Never share unredacted resolved secrets.</text>
  </g>
</svg>
