<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title description">
  <title id="title">Browser and database use different addresses</title><desc id="description">The host browser connects to a loopback published port. Docker forwards to app port 3000. Only the server-side app connects to db port 5432 through internal service DNS; the database has no published host port.</desc>
  <rect width="640" height="360" rx="16" fill="#f1f5f9"/>
  <g font-family="sans-serif" font-size="18" text-anchor="middle" fill="#0f172a">
    <text x="320" y="30" font-weight="bold">Name the network for every address</text>
    <rect x="24" y="53" width="592" height="59" rx="10" fill="#dbeafe" stroke="#1d4ed8"/><text x="320" y="88">Host browser → 127.0.0.1:published-port</text>
    <path d="M320 116v32m-6-7 6 7 6-7" fill="none" stroke="#334155" stroke-width="3"/>
    <rect x="24" y="155" width="592" height="178" rx="12" fill="none" stroke="#475569" stroke-dasharray="7 5"/>
    <text x="320" y="181" font-size="15">Private Compose network / Docker service DNS</text>
    <rect x="42" y="201" width="240" height="94" rx="10" fill="#dcfce7" stroke="#15803d"/><text x="162" y="235">app:3000</text><text x="162" y="265" font-size="16">Server-side DB client</text>
    <path d="M290 248h56m-8-6 8 6-8 6" fill="none" stroke="#334155" stroke-width="3"/>
    <rect x="357" y="201" width="240" height="94" rx="10" fill="#dbeafe" stroke="#1d4ed8"/><text x="477" y="235">db:5432</text><text x="477" y="265" font-size="16">No published host port</text>
    <text x="320" y="322" font-size="15">Browser code must not connect directly to PostgreSQL.</text>
  </g>
</svg>
