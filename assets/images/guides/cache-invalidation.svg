<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title description">
  <title id="title">Two build cache paths</title><desc id="description">An application edit reuses dependency installation but recompiles the application. A lockfile edit reinstalls dependencies and recompiles dependent application stages.</desc>
  <rect width="640" height="360" rx="16" fill="#f1f5f9"/>
  <g font-family="sans-serif" font-size="18" text-anchor="middle" fill="#0f172a">
    <text x="320" y="32" font-weight="bold">Put slow, stable inputs before changing source</text>
    <text x="164" y="75">Source edit only</text><text x="476" y="75">Lockfile edit</text>
    <rect x="24" y="98" width="280" height="64" rx="10" fill="#dcfce7" stroke="#15803d"/><text x="164" y="137">npm ci: reuse cache</text>
    <rect x="336" y="98" width="280" height="64" rx="10" fill="#ffedd5" stroke="#9a3412"/><text x="476" y="137">npm ci: run again</text>
    <path d="M164 168v42m-6-7 6 7 6-7M476 168v42m-6-7 6 7 6-7" fill="none" stroke="#334155" stroke-width="3"/>
    <rect x="24" y="220" width="280" height="64" rx="10" fill="#dbeafe" stroke="#1d4ed8"/><text x="164" y="259">Compile changed source</text>
    <rect x="336" y="220" width="280" height="64" rx="10" fill="#dbeafe" stroke="#1d4ed8"/><text x="476" y="259">Compile with new dependencies</text>
    <text x="320" y="328" font-size="16">A cache miss is normal. Correctness cannot depend on cache.</text>
  </g>
</svg>
