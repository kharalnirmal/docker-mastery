<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title description">
  <title id="title">Build context filtering boundary</title><desc id="description">The selected directory contains source and private local files. Docker ignore filtering excludes private files before COPY selects build inputs. Deleting a secret from a later layer is not equivalent to excluding it.</desc>
  <rect width="640" height="360" rx="16" fill="#f1f5f9"/>
  <g font-family="sans-serif" font-size="18" text-anchor="middle" fill="#0f172a">
    <text x="320" y="32" font-weight="bold">Choose the parcel before sending it</text>
    <rect x="24" y="58" width="592" height="58" rx="10" fill="#dbeafe" stroke="#1d4ed8"/><text x="320" y="93">Selected context: source + local files</text>
    <path d="M320 120v28m-6-7 6 7 6-7" fill="none" stroke="#334155" stroke-width="3"/>
    <rect x="24" y="156" width="280" height="70" rx="10" fill="#ffedd5" stroke="#9a3412"/><text x="164" y="184">Excluded by .dockerignore</text><text x="164" y="210">.env, dumps, dependencies</text>
    <rect x="336" y="156" width="280" height="70" rx="10" fill="#dcfce7" stroke="#15803d"/><text x="476" y="184">Allowed inputs</text><text x="476" y="210">Source + lockfile</text>
    <path d="M476 230v28m-6-7 6 7 6-7" fill="none" stroke="#334155" stroke-width="3"/>
    <rect x="336" y="266" width="280" height="52" rx="10" fill="#dbeafe" stroke="#1d4ed8"/><text x="476" y="299">COPY → image layers</text>
    <text x="166" y="290" font-size="16">Excluded ≠ copied then deleted</text><text x="320" y="344" font-size="15">The context root and Dockerfile location can differ.</text>
  </g>
</svg>
