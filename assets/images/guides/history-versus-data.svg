<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title description">
  <title id="title">Inspect real state and history separately</title><desc id="description">A failed migration requires two evidence tracks: actual schema and business rows, and ORM history. A reviewed plan reconciles both before retrying; a history edit never reverses SQL by itself.</desc>
  <rect width="640" height="360" rx="16" fill="#f1f5f9"/>
  <g font-family="sans-serif" font-size="18" text-anchor="middle" fill="#0f172a">
    <text x="320" y="32" font-weight="bold">Two records must agree before a retry</text>
    <rect x="140" y="54" width="360" height="48" rx="10" fill="#ffedd5" stroke="#9a3412"/><text x="320" y="84">Migration command fails</text>
    <path d="M320 106v22H164v25m156-25h156v25" fill="none" stroke="#334155" stroke-width="3"/>
    <rect x="24" y="161" width="280" height="78" rx="10" fill="#dbeafe" stroke="#1d4ed8"/><text x="164" y="191">Actual database</text><text x="164" y="217" font-size="16">Schema + business rows</text>
    <rect x="336" y="161" width="280" height="78" rx="10" fill="#dbeafe" stroke="#1d4ed8"/><text x="476" y="191">ORM history</text><text x="476" y="217" font-size="16">Recorded migration state</text>
    <path d="M164 243v23h312v-23M320 266v20" fill="none" stroke="#334155" stroke-width="3"/>
    <text x="320" y="308">Reviewed repair → justified reconciliation → retry</text><text x="320" y="337" font-size="15">Editing history does not undo SQL or recover deleted data.</text>
  </g>
</svg>
