<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title description">
  <title id="title">Graceful shutdown and its deadline</title><desc id="description">A configured stop signal reaches the main process. Work drains before the deadline for a clean exit; exceeding the deadline leads to forced termination.</desc>
  <rect width="640" height="360" rx="16" fill="#f1f5f9"/>
  <g font-family="sans-serif" font-size="18" text-anchor="middle" fill="#0f172a">
    <text x="320" y="32" font-weight="bold">Stop is a protocol, not a power switch</text>
    <rect x="140" y="54" width="360" height="52" rx="10" fill="#dbeafe" stroke="#1d4ed8"/><text x="320" y="86">Configured signal → main process</text>
    <path d="M320 109v26m-6-7 6 7 6-7" fill="none" stroke="#334155" stroke-width="3"/>
    <rect x="140" y="143" width="360" height="62" rx="10" fill="#dbeafe" stroke="#1d4ed8"/><text x="320" y="168">Stop new work; drain requests</text><text x="320" y="192" font-size="15">Application must implement this</text>
    <path d="M320 208v20H164v26m156-26h156v26" fill="none" stroke="#334155" stroke-width="3"/>
    <rect x="24" y="260" width="280" height="65" rx="10" fill="#dcfce7" stroke="#15803d"/><text x="164" y="286">Within grace period</text><text x="164" y="311">Close connections; exit</text>
    <rect x="336" y="260" width="280" height="65" rx="10" fill="#ffedd5" stroke="#9a3412"/><text x="476" y="286">Deadline exceeded</text><text x="476" y="311">Forced termination</text>
  </g>
</svg>
