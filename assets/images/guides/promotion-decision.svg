<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title description">
  <title id="title">Artifact promotion and the release decision</title><desc id="description">Reviewed code passes tests before approved publishing. The exact app and tools artifacts are deployed after backup and a compatible migration. Verification either accepts the release or requires a schema-compatible rollback and separate data-recovery decision.</desc>
  <rect width="640" height="360" rx="16" fill="#f1f5f9"/>
  <g font-family="sans-serif" font-size="18" text-anchor="middle" fill="#0f172a">
    <text x="320" y="32" font-weight="bold">One reviewed candidate through the release</text>
    <rect x="24" y="56" width="592" height="52" rx="10" fill="#dbeafe" stroke="#1d4ed8"/><text x="320" y="88">Review → tests → build → approved publishing</text>
    <path d="M320 112v24m-6-7 6 7 6-7" fill="none" stroke="#334155" stroke-width="3"/>
    <rect x="24" y="145" width="592" height="59" rx="10" fill="#dbeafe" stroke="#1d4ed8"/><text x="320" y="171">Backup → migrate once → deploy recorded artifact</text><text x="320" y="194" font-size="15">Health + readiness + real demo operation</text>
    <path d="M320 208v18H164v24m156-24h156v24" fill="none" stroke="#334155" stroke-width="3"/>
    <rect x="24" y="259" width="280" height="61" rx="10" fill="#dcfce7" stroke="#15803d"/><text x="164" y="285">Verification passes</text><text x="164" y="309" font-size="16">Accept; retain recovery evidence</text>
    <rect x="336" y="259" width="280" height="61" rx="10" fill="#ffedd5" stroke="#9a3412"/><text x="476" y="285">Verification fails</text><text x="476" y="309" font-size="16">Check rollback compatibility first</text>
    <text x="320" y="345" font-size="15">Returning to an old image does not reverse SQL or new writes.</text>
  </g>
</svg>
