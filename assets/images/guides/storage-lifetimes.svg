<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title description">
  <title id="title">Storage survives different lifecycle events</title><desc id="description">The writable layer survives stopping but not container removal. Named volumes and bind-mounted host files survive container replacement unless separately deleted. Tmpfs data disappears when stopped. Persistence is not backup.</desc>
  <rect width="640" height="360" rx="16" fill="#f1f5f9"/>
  <g font-family="sans-serif" font-size="17" fill="#0f172a">
    <text x="320" y="32" text-anchor="middle" font-weight="bold">Different lifetimes, different responsibilities</text>
    <text x="28" y="78" font-weight="bold">Storage</text><text x="260" y="78" font-weight="bold">After stop</text><text x="430" y="78" font-weight="bold">After removal</text>
    <rect x="20" y="95" width="600" height="43" rx="8" fill="#dbeafe"/><text x="30" y="123">Writable layer</text><text x="260" y="123">Retained</text><text x="430" y="123">Lost</text>
    <rect x="20" y="151" width="600" height="43" rx="8" fill="#dcfce7"/><text x="30" y="179">Named volume</text><text x="260" y="179">Retained</text><text x="430" y="179">Separate resource</text>
    <rect x="20" y="207" width="600" height="43" rx="8" fill="#dcfce7"/><text x="30" y="235">Bind-mounted files</text><text x="260" y="235">Host files remain</text><text x="430" y="235">Host files remain</text>
    <rect x="20" y="263" width="600" height="43" rx="8" fill="#ffedd5"/><text x="30" y="291">tmpfs</text><text x="260" y="291">Lost</text><text x="430" y="291">Lost</text>
    <text x="320" y="338" text-anchor="middle" font-size="16">No row provides an independent backup by itself.</text>
  </g>
</svg>
