<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title description">
  <title id="title">Temporary secret access is still trusted access</title><desc id="description">A fake secret is mounted for a reviewed build instruction. Only a nonsecret result is copied to the runtime stage. The mount disappears, but malicious build code could still copy the value or print it to logs.</desc>
  <rect width="640" height="360" rx="16" fill="#f1f5f9"/>
  <g font-family="sans-serif" font-size="18" text-anchor="middle" fill="#0f172a">
    <text x="320" y="32" font-weight="bold">Temporary access is not automatic confidentiality</text>
    <rect x="24" y="58" width="260" height="68" rx="10" fill="#dbeafe" stroke="#1d4ed8"/><text x="154" y="87">Fake secret on host</text><text x="154" y="112" font-size="15">Build secret interface</text>
    <path d="M291 92h55m-8-6 8 6-8 6" fill="none" stroke="#334155" stroke-width="3"/>
    <rect x="356" y="58" width="260" height="68" rx="10" fill="#dbeafe" stroke="#1d4ed8"/><text x="486" y="87">Reviewed RUN</text><text x="486" y="112" font-size="15">Temporary secret mount</text>
    <path d="M486 131v34m-6-7 6 7 6-7" fill="none" stroke="#334155" stroke-width="3"/>
    <rect x="356" y="175" width="260" height="68" rx="10" fill="#dcfce7" stroke="#15803d"/><text x="486" y="204">Intended nonsecret result</text><text x="486" y="229" font-size="15">Copy into runtime stage</text>
    <rect x="24" y="175" width="260" height="68" rx="10" fill="#ffedd5" stroke="#9a3412"/><text x="154" y="204">Possible unsafe side effect</text><text x="154" y="229" font-size="15">Secret copied or logged</text>
    <text x="320" y="294">Review instructions, outputs and logs.</text><text x="320" y="330" font-size="15">Mount absence alone is not proof that nothing leaked.</text>
  </g>
</svg>
