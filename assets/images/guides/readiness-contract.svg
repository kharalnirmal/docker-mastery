<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title description">
  <title id="title">Health is not dependency readiness</title><desc id="description">A running HTTP process can return health 200 while an unavailable database makes readiness return 503. Recovering the dependency restores readiness without requiring an endless application restart loop.</desc>
  <rect width="640" height="360" rx="16" fill="#f1f5f9"/>
  <g font-family="sans-serif" font-size="18" text-anchor="middle" fill="#0f172a">
    <text x="320" y="32" font-weight="bold">Ask what each check actually proves</text>
    <rect x="24" y="57" width="592" height="54" rx="10" fill="#dcfce7" stroke="#15803d"/><text x="320" y="90">App process responds to HTTP</text>
    <path d="M320 115v23H164v25m156-25h156v25" fill="none" stroke="#334155" stroke-width="3"/>
    <rect x="24" y="174" width="280" height="74" rx="10" fill="#dcfce7" stroke="#15803d"/><text x="164" y="203">/api/healthz → 200</text><text x="164" y="229" font-size="16">Process response only</text>
    <rect x="336" y="174" width="280" height="74" rx="10" fill="#ffedd5" stroke="#9a3412"/><text x="476" y="203">/api/readyz → 503</text><text x="476" y="229" font-size="16">Database unavailable</text>
    <path d="M476 252v26m-6-7 6 7 6-7" fill="none" stroke="#334155" stroke-width="3"/>
    <text x="320" y="302">Repair dependency → verify readiness + task behavior</text>
    <text x="320" y="337" font-size="15">An unhealthy Compose status alone does not restart a container.</text>
  </g>
</svg>
