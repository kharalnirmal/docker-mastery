<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title description">
  <title id="title">Public build values and private runtime values</title><desc id="description">Public variables referenced during a Next production build can be inlined into browser bundles. Private runtime server values are read by server code. Changing runtime variables does not rewrite already built browser files.</desc>
  <rect width="640" height="360" rx="16" fill="#f1f5f9"/>
  <g font-family="sans-serif" font-size="18" text-anchor="middle" fill="#0f172a">
    <text x="320" y="32" font-weight="bold">Build time and request time are different</text>
    <rect x="24" y="66" width="280" height="78" rx="10" fill="#dbeafe" stroke="#1d4ed8"/><text x="164" y="98">Public build value</text><text x="164" y="125" font-size="16">NEXT_PUBLIC_* reference</text>
    <rect x="336" y="66" width="280" height="78" rx="10" fill="#dcfce7" stroke="#15803d"/><text x="476" y="98">Private runtime value</text><text x="476" y="125" font-size="16">DATABASE_URL on server</text>
    <path d="M164 150v48m-6-7 6 7 6-7M476 150v48m-6-7 6 7 6-7" fill="none" stroke="#334155" stroke-width="3"/>
    <rect x="24" y="210" width="280" height="80" rx="10" fill="#ffedd5" stroke="#9a3412"/><text x="164" y="242">Emitted browser bundle</text><text x="164" y="269" font-size="16">Can contain frozen value</text>
    <rect x="336" y="210" width="280" height="80" rx="10" fill="#dcfce7" stroke="#15803d"/><text x="476" y="242">Server request code</text><text x="476" y="269" font-size="16">Never send DB credentials</text>
    <text x="320" y="333" font-size="15">Runtime env changes do not rewrite built browser JavaScript.</text>
  </g>
</svg>
