<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title description">
  <title id="title">Containers share a Linux kernel</title>
  <desc id="description">Application A and application B have separate process and filesystem views. Both call one Linux kernel. Docker Desktop supplies the Linux environment on Windows and macOS.</desc>
  <rect width="640" height="360" rx="16" fill="#f1f5f9"/>
  <g font-family="sans-serif" font-size="18" text-anchor="middle" fill="#0f172a">
    <text x="320" y="32" font-weight="bold">Isolation does not mean a separate kernel</text>
    <rect x="24" y="56" width="280" height="100" rx="12" fill="#dbeafe" stroke="#1d4ed8"/>
    <text x="164" y="88">Container A</text><text x="164" y="119">App + user-space files</text><text x="164" y="144" font-size="15">Own namespace views</text>
    <rect x="336" y="56" width="280" height="100" rx="12" fill="#dbeafe" stroke="#1d4ed8"/>
    <text x="476" y="88">Container B</text><text x="476" y="119">App + user-space files</text><text x="476" y="144" font-size="15">Own namespace views</text>
    <path d="M164 160v37m-6-7 6 7 6-7M476 160v37m-6-7 6 7 6-7" fill="none" stroke="#334155" stroke-width="3"/>
    <rect x="24" y="206" width="592" height="60" rx="12" fill="#dcfce7" stroke="#15803d"/>
    <text x="320" y="243">One Linux kernel: system calls + resource controls</text>
    <text x="320" y="302">Linux host, or Desktop's Linux environment</text>
    <text x="320" y="332" font-size="15">A container does not boot another kernel.</text>
  </g>
</svg>
