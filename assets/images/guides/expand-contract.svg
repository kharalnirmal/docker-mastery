<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title description">
  <title id="title">Expand, adopt and later contract</title><desc id="description">A compatible schema expansion allows old and new code to coexist. New code adopts the schema and data is verified. Only a later reviewed release removes old fields after old code and rollback dependencies are gone.</desc>
  <rect width="640" height="360" rx="16" fill="#f1f5f9"/>
  <g font-family="sans-serif" font-size="18" text-anchor="middle" fill="#0f172a">
    <text x="320" y="32" font-weight="bold">Database changes outlive application containers</text>
    <rect x="24" y="56" width="592" height="60" rx="10" fill="#dcfce7" stroke="#15803d"/><text x="320" y="82">1. Expand: add compatible schema</text><text x="320" y="105" font-size="15">Current code keeps working; original rows retained</text>
    <path d="M320 120v25m-6-7 6 7 6-7" fill="none" stroke="#334155" stroke-width="3"/>
    <rect x="24" y="154" width="592" height="60" rx="10" fill="#dbeafe" stroke="#1d4ed8"/><text x="320" y="180">2. Adopt: new code + verified backfill</text><text x="320" y="203" font-size="15">Test overlap and the rollback compatibility window</text>
    <path d="M320 218v25m-6-7 6 7 6-7" fill="none" stroke="#334155" stroke-width="3"/>
    <rect x="24" y="252" width="592" height="60" rx="10" fill="#ffedd5" stroke="#9a3412"/><text x="320" y="278">3. Contract: a later reviewed release</text><text x="320" y="301" font-size="15">Only after all old readers and writers are retired</text>
    <text x="320" y="343" font-size="15">Application rollback does not reverse database changes.</text>
  </g>
</svg>
