<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300" role="img" aria-labelledby="title desc"><title id="title">Persistent data and tested restoration</title><desc id="desc">Writer and reader use one notes volume independently. A read-only source is archived to backup storage. The archive is extracted to a different restored volume and the result compared, without deleting the original.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="m0 0 8 4-8 4" fill="#0070f3"/></marker></defs><rect width="800" height="300" fill="#fafafa"/><g font-family="Inter,system-ui,sans-serif" fill="#222"><text x="25" y="32" font-size="16" font-weight="bold">NAMED VOLUMES OUTLIVE INDIVIDUAL CONTAINERS</text><g fill="#fff" stroke="#aaa"><rect x="25" y="58" width="195" height="65" rx="8"/><rect x="25" y="155" width="195" height="70" rx="8"/><rect x="300" y="155" width="195" height="70" rx="8"/><rect x="575" y="155" width="195" height="70" rx="8"/></g><text x="42" y="84" font-size="14">Writer / reader containers</text><text x="42" y="107" font-size="12">Mount /data independently</text><text x="42" y="183" font-size="15">notes volume</text><text x="42" y="206" font-size="12">note.txt · checkpoint-01</text><text x="317" y="183" font-size="15">backup volume</text><text x="317" y="206" font-size="12">notes.tar archive</text><text x="592" y="183" font-size="15">restored volume</text><text x="592" y="206" font-size="12">Verify note.txt matches</text><path d="M122 123v25M220 190h73M495 190h73" stroke="#0070f3" stroke-width="2" marker-end="url(#a)"/><text x="232" y="175" font-size="11">archive</text><text x="507" y="175" font-size="11">extract</text><text x="25" y="270" font-size="13">Static-file teaching lab only. A live PostgreSQL data directory needs a database-consistent backup.</text></g></svg>
