<svg xmlns="http://www.w3.org/2000/svg" width="800" height="290" viewBox="0 0 800 290" role="img" aria-labelledby="title desc">
<title id="title">Host and container ports</title><desc id="desc">A local browser connects to host loopback port 8080; Docker forwards the request into the Linux engine environment to NGINX container port 80.</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="m0 0 8 4-8 4" fill="#216b56"/></marker></defs>
<rect width="800" height="290" fill="#f6f8f3"/><g font-family="system-ui,sans-serif" fill="#22382d"><text x="30" y="35" font-size="15" font-weight="bold">LOCAL MACHINE · not the public internet</text><rect x="25" y="66" width="200" height="135" rx="10" fill="#fff" stroke="#abbcae"/><text x="45" y="100" font-size="18">Host browser</text><text x="45" y="130" font-size="14">127.0.0.1:8080</text><text x="45" y="157" font-size="12">Host port 8080</text><rect x="390" y="64" width="380" height="170" rx="10" fill="#e8f1e9" stroke="#216b56" stroke-dasharray="5 4"/><text x="410" y="92" font-size="14">Linux engine · VM / WSL2 on Desktop</text><rect x="450" y="115" width="285" height="96" rx="8" fill="#fff" stroke="#216b56"/><text x="470" y="149" font-size="18">NGINX container</text><text x="470" y="181" font-size="14">HTTP listener · port 80</text><path d="M225 145H445" stroke="#216b56" stroke-width="2" marker-end="url(#a)"/><text x="251" y="131" font-size="12">Docker forwards →</text><text x="30" y="268" font-size="13">Publishing rule: 127.0.0.1:8080:80 · host address : host port : container port</text></g></svg>
