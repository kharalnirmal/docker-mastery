<svg xmlns="http://www.w3.org/2000/svg" width="800" height="230" viewBox="0 0 800 230" role="img" aria-labelledby="title desc"><title id="title">Evidence-led recovery</title><desc id="desc">Inspect state and logs, compare the startup command, recreate only the lab container using the correct default, then verify HTTP behavior.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="m0 0 8 4-8 4" fill="#216b56"/></marker></defs><rect width="800" height="230" fill="#f6f8f3"/><g font-family="system-ui,sans-serif" fill="#22382d"><text x="25" y="35" font-size="16" font-weight="bold">RECOVER WITH EVIDENCE, NOT A GLOBAL RESET</text><g fill="#fff" stroke="#abbcae"><rect x="25" y="75" width="165" height="90" rx="8"/><rect x="220" y="75" width="165" height="90" rx="8"/><rect x="415" y="75" width="165" height="90" rx="8"/><rect x="610" y="75" width="165" height="90" rx="8"/></g><g font-size="15"><text x="41" y="107">1. Inspect</text><text x="237" y="107">2. Hypothesize</text><text x="431" y="107">3. Recreate</text><text x="627" y="107">4. Verify</text></g><g font-size="12"><text x="41" y="138">State + logs</text><text x="237" y="138">Wrong config path?</text><text x="431" y="138">Only the lab container</text><text x="627" y="138">HTTP + running state</text></g><path d="M190 120h24M385 120h24M580 120h24" stroke="#216b56" stroke-width="2" marker-end="url(#a)"/><text x="25" y="202" font-size="13">Keep observed facts separate from hypotheses. A container ID is not proof of health.</text></g></svg>
