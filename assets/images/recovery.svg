<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" role="img" aria-labelledby="title desc">
  <title id="title">Logical backup and separate restore destination</title>
  <desc id="desc">The tracker database exports a snapshot to a host archive, then restores it into empty tracker_restore. Both databases share the lab server; the source is never overwritten.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#2563eb"/></marker></defs>
  <rect width="820" height="300" rx="16" fill="#f8fafc"/>
  <g font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#0f172a">
    <rect x="25" y="25" width="770" height="250" rx="12" fill="none" stroke="#64748b" stroke-dasharray="6 4"/>
    <text x="410" y="53">Local drill: same host, not independent disaster recovery</text>
    <rect x="55" y="95" width="190" height="100" rx="10" fill="#dbeafe" stroke="#2563eb"/>
    <text x="150" y="132">Source: tracker</text><text x="150" y="160">Schema + rows + history</text>
    <rect x="315" y="95" width="190" height="100" rx="10" fill="#ffedd5" stroke="#c2410c"/>
    <text x="410" y="132">Host archive</text><text x="410" y="160">Consistent snapshot</text>
    <rect x="575" y="95" width="190" height="100" rx="10" fill="#dcfce7" stroke="#15803d"/>
    <text x="670" y="132">tracker_restore</text><text x="670" y="160">Empty destination first</text>
    <path d="M245 145H307M505 145H567" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="280" y="87" font-size="13">dump + copy</text><text x="540" y="87" font-size="13">restore</text>
    <text x="410" y="235">Verify exact tasks, assignments, constraints and migration history</text>
  </g>
</svg>
